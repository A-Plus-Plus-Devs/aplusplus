<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Hexagon background -->
  <path d="M200 20
           L360 110
           L360 290
           L200 380
           L40 290
           L40 110 Z" 
        fill="#719ace"/>
  
  <!-- Dark blue overlay for gradient effect -->
  <path d="M200 380
           L360 290
           L360 110
           L200 180 Z" 
        fill="#245696"/>

   <!-- Left half (original color) -->
  <path d="M200 380
           L360 290
           L200 180 Z" 
        fill="#173d75"/>

   <path d="M200 380
           L360 290
           T360 110
           L200 180 Z" 
        fill="#173d75" 
        transform="scale(-1, 1) translate(-400, 0)" />
  
  
  
  <!-- A letter with proper horizontal bar -->
  <path d="M130 280
           L200 120
           L270 280
           M160 220
           L240 220" 
        fill="none"
        stroke="white" 
        stroke-width="40"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- ++ symbols in corner -->
  <g transform="translate(280,220) scale(0.8)">
    <!-- First + -->
    <rect x="0" y="-20" width="40" height="10" fill="white"/>
    <rect x="15" y="-35" width="10" height="40" fill="white"/>
    
    <!-- Second + -->
    <rect x="50" y="-20" width="40" height="10" fill="white"/>
    <rect x="65" y="-35" width="10" height="40" fill="white"/>
  </g>
</svg>